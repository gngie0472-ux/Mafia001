name: Build DramaRush APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. إعداد Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 4. تثبيت الحزم
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 5. إنشاء مشروع Android إذا لم يكن موجودًا
      - name: Generate Android project
        run: |
          if [ ! -d "android" ]; then
            npx expo prebuild --platform android --non-interactive
          else
            echo "Android project already exists."
          fi

      # 6. إعطاء Gradle صلاحية التنفيذ
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      # 7. تنظيف Gradle
      - name: Clean Gradle
        working-directory: android
        run: |
          ./gradlew clean --no-daemon

      # 8. بناء Debug APK مباشرة بدون EAS
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 9. تجهيز APK
      - name: Prepare APK
        run: |
          mkdir -p release

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/DramaRush-v1.0-debug.apk

          ls -lh release/DramaRush-v1.0-debug.apk

      # 10. رفع APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DramaRush-APK
          path: release/DramaRush-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 7

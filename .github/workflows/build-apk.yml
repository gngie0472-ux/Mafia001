name: Build Mafia Night APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Initialize EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas init --account pyouri --non-interactive

      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Get latest EAS APK URL
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build:list --platform android --status finished --limit 1 --json > eas-build.json

          APK_URL=$(node -e "
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const b = Array.isArray(d) ? d[0] : d;
          console.log(b?.artifacts?.buildUrl || '');
          ")

          if [ -z "$APK_URL" ]; then
            echo "Could not find APK download URL."
            cat eas-build.json
            exit 1
          fi

          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"

      - name: Download APK from EAS
        run: |
          curl -L --fail --retry 3 "$APK_URL" -o MafiaNight.apk

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: MafiaNight-APK
          path: MafiaNight.apk
          if-no-files-found: error
          retention-days: 7

name: Build Mafia Night APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. Setup Node.js
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ============================================
      # 3. Setup Java 17
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17


      # ============================================
      # 4. Verify project files
      # ============================================
      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f package.json
          test -f app.json

          echo "package.json found."
          echo "app.json found."


      # ============================================
      # 5. Verify package configuration
      # ============================================
      - name: Verify package configuration
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const pkg = require('./package.json');

          if (!pkg.dependencies) {
            throw new Error('dependencies section is missing');
          }

          const required = [
            'expo',
            'expo-router',
            '@supabase/supabase-js',
            '@livekit/react-native',
            '@livekit/react-native-webrtc',
            '@livekit/react-native-expo-plugin',
            'livekit-client'
          ];

          for (const name of required) {
            if (!pkg.dependencies[name]) {
              throw new Error(`Missing dependency: ${name}`);
            }

            console.log(
              `${name}: ${pkg.dependencies[name]}`
            );
          }

          if (pkg.main !== 'expo-router/entry') {
            throw new Error(
              'package.json main must be expo-router/entry'
            );
          }

          console.log(
            'package.json configuration verified.'
          );
          NODE


      # ============================================
      # 6. Verify Supabase environment
      # ============================================
      - name: Verify Supabase environment
        shell: bash
        run: |
          set -e

          if [ ! -f .env ]; then
            echo "ERROR: .env file is missing."
            exit 1
          fi

          set -a
          source .env
          set +a

          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_URL is missing."
            exit 1
          fi

          if [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_ANON_KEY is missing."
            exit 1
          fi

          EXPECTED_URL="https://bxaajugwvfgbyltutwlt.supabase.co"

          if [ "$EXPO_PUBLIC_SUPABASE_URL" != "$EXPECTED_URL" ]; then
            echo "ERROR: Wrong Supabase URL."
            exit 1
          fi

          echo "Supabase environment verified."


      # ============================================
      # 7. Clean dependencies
      # ============================================
      - name: Clean dependencies
        shell: bash
        run: |
          set -e

          rm -rf node_modules

          npm cache clean --force

          echo "Dependency environment cleaned."


      # ============================================
      # 8. Install dependencies
      # ============================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          npm install --legacy-peer-deps

          echo "Dependencies installed successfully."


      # ============================================
      # 9. Verify Expo
      # ============================================
      - name: Verify Expo installation
        shell: bash
        run: |
          set -e

          test -d node_modules/expo

          node -e \
            "console.log('Expo:', require('expo/package.json').version)"

          node -e \
            "require.resolve('expo')"

          echo "Expo installed correctly."


      # ============================================
      # 10. Verify important dependencies
      # ============================================
      - name: Verify dependencies
        shell: bash
        run: |
          set -e

          node -e \
            "require.resolve('expo-router/entry')"

          node -e \
            "require.resolve('@supabase/supabase-js')"

          node -e \
            "require.resolve('@livekit/react-native')"

          node -e \
            "require.resolve('@livekit/react-native-webrtc')"

          node -e \
            "require.resolve('livekit-client')"

          node -e \
            "require.resolve('@react-native-async-storage/async-storage')"

          node -e \
            "require.resolve('react-native-url-polyfill/auto')"

          echo "All required dependencies verified."


      # ============================================
      # 11. Verify Expo configuration
      # ============================================
      - name: Verify Expo configuration
        shell: bash
        run: |
          set -e

          npx expo --version

          npx expo config --type public

          echo "Expo configuration verified."


      # ============================================
      # 12. Generate Android project
      # ============================================
      - name: Generate Android project
        shell: bash
        run: |
          set -e

          set -a
          source .env
          set +a

          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

          echo "Android project generated successfully."


      # ============================================
      # 13. Verify Android project
      # ============================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f android/gradlew

          test -f \
            android/gradle/wrapper/gradle-wrapper.properties

          test -f android/app/build.gradle

          echo "Android project verified."


      # ============================================
      # 14. Prepare Gradle
      # ============================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          chmod +x android/gradlew

          echo "Gradle prepared."


      # ============================================
      # 15. Build Release APK
      # ============================================
      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -e

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

          echo "Release APK build completed."


      # ============================================
      # 16. Verify APK
      # ============================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

          ls -lh "$APK"


      # ============================================
      # 17. Prepare final APK
      # ============================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find \
            android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Cannot find APK."
            exit 1
          fi

          cp "$APK" \
            release/Mafia-Night-v1.0.apk

          echo "Final APK prepared."

          ls -lh \
            release/Mafia-Night-v1.0.apk


      # ============================================
      # 18. Upload APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafia-Night-APK
          path: release/Mafia-Night-v1.0.apk
          if-no-files-found: error
          retention-days: 7

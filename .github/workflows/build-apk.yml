name: Build Mafia Night APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. Checkout
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. Node.js
      # ============================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ============================================
      # 3. Java 17
      # ============================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17


      # ============================================
      # 4. Verify project files
      # ============================================
      - name: Verify project files
        shell: bash
        run: |
          set -e

          test -f package.json

          if [ ! -f .env ]; then
            echo "ERROR: .env file is missing."
            exit 1
          fi

          echo "package.json found."
          echo ".env found."


      # ============================================
      # 5. Load and verify Supabase environment
      # ============================================
      - name: Verify Supabase environment
        shell: bash
        run: |
          set -e

          set -a
          source .env
          set +a

          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_URL is missing."
            exit 1
          fi

          if [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_ANON_KEY is missing."
            exit 1
          fi

          EXPECTED_URL="https://bxaajugwvfgbyltutwlt.supabase.co"

          if [ "$EXPO_PUBLIC_SUPABASE_URL" != "$EXPECTED_URL" ]; then
            echo "ERROR: Wrong Supabase URL."
            echo "Expected: $EXPECTED_URL"
            echo "Found:    $EXPO_PUBLIC_SUPABASE_URL"
            exit 1
          fi

          echo "Supabase URL verified."
          echo "Supabase anon key found."


      # ============================================
      # 6. Install dependencies
      # ============================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          npm install

          echo "Dependencies installed successfully."


      # ============================================
      # 7. Verify important dependencies
      # ============================================
      - name: Verify dependencies
        shell: bash
        run: |
          set -e

          node -e "require.resolve('expo')"
          node -e "require.resolve('expo-router/entry')"
          node -e "require.resolve('@supabase/supabase-js')"
          node -e "require.resolve('@react-native-async-storage/async-storage')"
          node -e "require.resolve('react-native-url-polyfill/auto')"

          echo "Required dependencies verified."


      # ============================================
      # 8. Verify Expo configuration
      # ============================================
      - name: Verify Expo configuration
        shell: bash
        run: |
          set -e

          npx expo --version
          npx expo config --type public

          echo "Expo configuration verified."


      # ============================================
      # 9. Verify Expo Router
      # ============================================
      - name: Verify Expo Router
        shell: bash
        run: |
          set -e

          node -e "
            const pkg = require('./package.json');

            if (pkg.main !== 'expo-router/entry') {
              console.error('ERROR: package.json main must be expo-router/entry');
              process.exit(1);
            }
          "

          node -e "require.resolve('expo-router/entry')"

          echo "Expo Router verified."


      # ============================================
      # 10. Generate Android project
      # ============================================
      - name: Generate Android project
        shell: bash
        run: |
          set -e

          set -a
          source .env
          set +a

          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean

          echo "Android project generated successfully."


      # ============================================
      # 11. Verify Android project
      # ============================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/build.gradle

          echo "Android project verified."


      # ============================================
      # 12. Prepare Gradle
      # ============================================
      - name: Prepare Gradle
        shell: bash
        run: |
          chmod +x android/gradlew


      # ============================================
      # 13. Build Release APK
      # ============================================
      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -e

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # ============================================
      # 14. Find generated APK
      # ============================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          echo "$APK"

          ls -lh "$APK"


      # ============================================
      # 15. Prepare final APK
      # ============================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Cannot find APK."
            exit 1
          fi

          cp "$APK" release/Mafia-Night-v1.0.apk

          echo "Final APK:"
          ls -lh release/Mafia-Night-v1.0.apk


      # ============================================
      # 16. Upload APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafia-Night-APK
          path: release/Mafia-Night-v1.0.apk
          if-no-files-found: error
          retention-days: 7

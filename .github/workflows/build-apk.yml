name: Build Mafia Night APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # 3. Java 17
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17


      # 4. Verify Supabase environment
      - name: Verify Supabase environment
        shell: bash
        run: |
          set -e

          if [ ! -f .env ]; then
            echo "ERROR: .env file is missing."
            exit 1
          fi

          set -a
          source .env
          set +a

          if [ -z "${EXPO_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_URL is missing."
            exit 1
          fi

          if [ -z "${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: EXPO_PUBLIC_SUPABASE_ANON_KEY is missing."
            exit 1
          fi

          EXPECTED_URL="https://bxaajugwvfgbyltutwlt.supabase.co"

          if [ "$EXPO_PUBLIC_SUPABASE_URL" != "$EXPECTED_URL" ]; then
            echo "ERROR: Supabase URL does not match Mafia Night."
            echo "Expected: $EXPECTED_URL"
            echo "Found:    $EXPO_PUBLIC_SUPABASE_URL"
            exit 1
          fi

          echo "Supabase URL verified."
          echo "Supabase anon key is present."


      # 5. Install dependencies
      - name: Install dependencies
        run: npm install


      # 6. Verify Supabase packages
      - name: Verify Supabase dependencies
        run: |
          node -e "require.resolve('react-native-url-polyfill/auto')"
          node -e "require.resolve('@supabase/supabase-js')"
          node -e "require.resolve('@react-native-async-storage/async-storage')"

          echo "All Supabase dependencies are installed."


      # 7. Verify Expo
      - name: Verify Expo configuration
        run: |
          npx expo --version
          npx expo config --type public


      # 8. Verify Expo Router
      - name: Verify Expo Router
        run: |
          node -e "const p=require('./package.json'); if(p.main!=='expo-router/entry'){throw new Error('package.json main must be expo-router/entry')}"
          node -e "require.resolve('expo-router/entry')"

          echo "Expo Router configuration is correct."


      # 9. Generate Android project
      - name: Generate Android project
        shell: bash
        run: |
          set -e

          set -a
          source .env
          set +a

          npx expo prebuild \
            --platform android \
            --non-interactive \
            --clean


      # 10. Verify Android project
      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Android project verified."


      # 11. Prepare Gradle
      - name: Prepare Gradle
        run: chmod +x android/gradlew


      # 12. Build Release APK
      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace


      # 13. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"


      # 14. Prepare APK
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" release/Mafia-Night-v1.0.apk

          echo "Final APK:"
          ls -lh release/Mafia-Night-v1.0.apk


      # 15. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mafia-Night-APK
          path: release/Mafia-Night-v1.0.apk
          if-no-files-found: error
          retention-days: 7

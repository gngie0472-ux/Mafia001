name: Extract MafiaNight ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o MafiaNight.zip -d extracted

          # If the ZIP contains a top-level MafiaNight folder,
          # move its contents to the repository root.
          if [ -d "extracted/MafiaNight" ]; then
            cp -a extracted/MafiaNight/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted
          rm -f MafiaNight.zip

      - name: Show project files
        run: |
          echo "Project structure:"
          find . -maxdepth 2 -type f | sort

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract MafiaNight project"
            git push
          fi
